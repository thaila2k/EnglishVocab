<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Từ Tiếng Anh</title>
<meta name="description" content="Học từ vựng tiếng Anh bằng thẻ ghi nhớ, lặp lại ngắt quãng và bài kiểm tra nhanh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Gentium+Book+Plus&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#today" data-view="today" aria-label="Sổ Từ, về trang Hôm nay">
      <span class="brand-mark" aria-hidden="true">Aa</span>
      <span class="brand-name">Sổ <span class="hl">Từ</span></span>
    </a>
    <nav class="tabs" aria-label="Điều hướng chính">
      <button type="button" class="tab" data-view="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Hôm nay</span></button>
      <button type="button" class="tab" data-view="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg><span>Thẻ từ</span></button>
      <button type="button" class="tab" data-view="quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg><span>Luyện tập</span></button>
      <button type="button" class="tab" data-view="words"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg><span>Sổ từ</span></button>
    </nav>
  </div>
</header>

<main id="app" class="wrap">
  <section id="view-today" class="view" aria-labelledby="today-title"></section>
  <section id="view-learn" class="view" aria-label="Thẻ từ" hidden></section>
  <section id="view-quiz" class="view" aria-label="Luyện tập" hidden></section>
  <section id="view-words" class="view" aria-label="Sổ từ" hidden></section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/vocab.js"></script>
<script src="js/data/everyday.js"></script>
<script src="js/data/food-shopping.js"></script>
<script src="js/data/travel.js"></script>
<script src="js/data/nature.js"></script>
<script src="js/data/health-sports.js"></script>
<script src="js/data/work-study.js"></script>
<script src="js/data/tech-science.js"></script>
<script src="js/data/society.js"></script>
<script src="js/data/core.js"></script>
<script src="js/data/toeic-workplace.js"></script>
<script src="js/data/toeic-commerce.js"></script>
<script src="js/data/toeic-operations.js"></script>
<script src="js/data/toeic-finance.js"></script>
<script src="js/data/toeic-services.js"></script>
<script src="js/app.js"></script>
</body>
</html>
